services:
  cassandra:
    image: cassandra:5.0
    container_name: ml-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MLCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: Rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 256
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
      CASSANDRA_SUPERUSER: ${CASSANDRA_USERNAME:-test}
      CASSANDRA_SUPERUSER_PASSWORD: ${CASSANDRA_PASSWORD:-qwerty123}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-test}
    volumes:
      - ./scripts/cassandra-init.sh:/scripts/cassandra-init.sh
      - ./data/processed:/data/processed:ro
    command: /scripts/cassandra-init.sh
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u ${CASSANDRA_USERNAME} -p${CASSANDRA_PASSWORD} -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
    network_mode: host
    pull_policy: build
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: ${CASSANDRA_HOST:-127.0.0.1}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:-test}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-qwerty123}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-test}
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
