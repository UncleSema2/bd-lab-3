services:
  cassandra:
    image: cassandra:5.0
    container_name: ml-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    env_file: .env
    environment:
      CASSANDRA_CLUSTER_NAME: MLCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: Rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 256
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
      CASSANDRA_SUPERUSER: ${CASSANDRA_USERNAME}
      CASSANDRA_SUPERUSER_PASSWORD: ${CASSANDRA_PASSWORD}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
    volumes:
      - ./scripts/cassandra-init.sh:/scripts/cassandra-init.sh
      - ./data/processed:/data/processed:ro
    command: /scripts/cassandra-init.sh
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u ${CASSANDRA_USERNAME} -p${CASSANDRA_PASSWORD} -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
    network_mode: host
    pull_policy: build
    depends_on:
      cassandra:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "curl http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
