name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Set up Ansible
        run: pip install ansible

      - name: Decrypt vault and generate .env
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass
          vault_content=$(ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass ansible-vault view ansible/group_vars/all/vault.yml)
          echo "$vault_content" | grep '^cassandra_host:' | awk '{print "CASSANDRA_HOST=" $2}' | sed 's/"//g' > .env
          echo "$vault_content" | grep '^cassandra_port:' | awk '{print "CASSANDRA_PORT=" $2}' | sed 's/"//g' >> .env
          echo "$vault_content" | grep '^cassandra_keyspace:' | awk '{print "CASSANDRA_KEYSPACE=" $2}' | sed 's/"//g' >> .env
          echo "$vault_content" | grep '^cassandra_username:' | awk '{print "CASSANDRA_USERNAME=" $2}' | sed 's/"//g' >> .env
          echo "$vault_content" | grep '^cassandra_password:' | awk '{print "CASSANDRA_PASSWORD=" $2}' | sed 's/"//g' >> .env
          echo "$vault_content" | grep '^model_version:' | awk '{print "MODEL_VERSION=" $2}' | sed 's/"//g' >> .env
          cat .env
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Pull DVC data
        run: |
          pip install -r requirements.txt
          vault_content=$(ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass ansible-vault view ansible/group_vars/all/vault.yml)
          dvc remote modify remote --local access_key_id "$(echo "$vault_content" | grep '^aws_access_key_id:' | awk '{print $2}' | sed 's/"//g')"
          dvc remote modify remote --local secret_access_key "$(echo "$vault_content" | grep '^aws_secret_access_key:' | awk '{print $2}' | sed 's/"//g')"
          dvc pull
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Log in to DockerHub
        run: |
          vault_content=$(ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass ansible-vault view ansible/group_vars/all/vault.yml)
          echo "$(echo "$vault_content" | grep '^dockerhub_token:' | awk '{print $2}' | sed 's/"//g')" | docker login -u "$(echo "$vault_content" | grep '^dockerhub_username:' | awk '{print $2}' | sed 's/"//g')" --password-stdin
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Pull latest image
        run: docker pull unclesema2/bd-lab-3-8:latest || true

      - name: Start services
        run: docker compose up -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          docker compose logs web
          exit 1

      - name: Run functional API test
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/predict" \
            -H "Content-Type: application/json" \
            -d @tests/test_0.json)
          echo "Response: $response"
          echo "$response" | grep -q '"prediction":'

      - name: Run /train endpoint
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/train?model=LOG_REG")
          echo "Response: $response"
          echo "$response" | grep -q '"trained":true'

      - name: Run /evaluate endpoint
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/evaluate?model=LOG_REG")
          echo "Response: $response"
          echo "$response" | grep -q '"accuracy":'

      - name: Run unit tests with coverage inside container
        run: |
          docker compose exec -T web sh -c "pip install --no-cache-dir coverage==7.6.10 && \
            coverage run --source=src -m unittest discover -s src/unit_tests -p "test_*.py" && \
            coverage report -m"

      - name: Stop services
        if: always()
        run: docker compose down -v
