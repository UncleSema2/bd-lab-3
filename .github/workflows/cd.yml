name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Pull DVC data
        run: |
          pip install -r requirements.txt
          dvc remote modify remote --local access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          dvc remote modify remote --local secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env file
        run: |
          cat > .env <<EOF
          CASSANDRA_HOST=${{ secrets.CASSANDRA_HOST }}
          CASSANDRA_USERNAME=${{ secrets.CASSANDRA_USERNAME }}
          CASSANDRA_PASSWORD=${{ secrets.CASSANDRA_PASSWORD }}
          CASSANDRA_KEYSPACE=${{ secrets.CASSANDRA_KEYSPACE }}
          CASSANDRA_PORT=${{ secrets.CASSANDRA_PORT }}
          EOF

      - name: Pull latest image
        run: docker pull unclesema2/bd-lab-2-8:latest || true

      - name: Start services
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          docker compose -f docker-compose.prod.yml logs web
          exit 1

      - name: Run functional API test
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/predict" \
            -H "Content-Type: application/json" \
            -d @tests/test_0.json)
          echo "Response: $response"
          echo "$response" | grep -q '"prediction":'

      - name: Run /train endpoint
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/train?model=LOG_REG")
          echo "Response: $response"
          echo "$response" | grep -q '"trained":true'

      - name: Run /evaluate endpoint
        run: |
          response=$(curl -sS -X POST "http://localhost:8000/evaluate?model=LOG_REG")
          echo "Response: $response"
          echo "$response" | grep -q '"accuracy":'

      - name: Run unit tests with coverage inside container
        run: |
          docker compose -f docker-compose.prod.yml exec -T web sh -c "pip install --no-cache-dir coverage==7.6.10 && \
            coverage run -m unittest discover -s src/unit_tests -p 'test_*.py' && \
            coverage report -m"

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
